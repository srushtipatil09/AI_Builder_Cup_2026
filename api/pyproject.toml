[project]
name = "saathi"
version = "0.1.0"
description = "Saathi API and worker for the Google Cloud AI Builder Cup 2026 prototype."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "google-genai>=0.1.1",
  "google-cloud-firestore>=2.19",
  "firebase-admin>=6.6",
  "google-cloud-bigquery>=3.27",
  "google-cloud-tasks>=2.18",
  "google-cloud-storage>=2.18",
]

[project.optional-dependencies]
adk = ["google-adk>=1.0"]
dev = ["httpx>=0.28", "pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saathi"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
